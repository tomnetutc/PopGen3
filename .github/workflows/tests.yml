name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os || 'ubuntu-latest' }} py${{ matrix.python }} ${{ matrix.label }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported stack
          - python: "3.9"
            label: numpy 1.21 / pandas 1.3
            pins: "numpy==1.21.6 pandas==1.3.5 scipy==1.10.1 pyyaml==6.0.1"
          - python: "3.10"
            label: numpy 1.26 / pandas 2.2
            pins: "numpy==1.26.4 pandas==2.2.3 scipy==1.13.1"
          - python: "3.11"
            label: numpy 1.23 / pandas 1.5
            pins: "numpy==1.23.5 pandas==1.5.3 scipy==1.10.1"
          - python: "3.12"
            label: numpy 1.26 / pandas 2.2
            pins: "numpy==1.26.4 pandas==2.2.3 scipy==1.13.1"
          # whatever `pip install popgen3` gets today (pandas 3)
          - python: "3.13"
            label: latest releases
            pins: ""
          # Windows writes CRLF files; the golden fingerprints are line-ending independent
          - os: windows-latest
            python: "3.12"
            label: numpy 1.26 / pandas 2.2
            pins: "numpy==1.26.4 pandas==2.2.3 scipy==1.13.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.pins }} -e ".[test]"
          python -c "import sys, numpy, pandas, scipy; print(sys.version, numpy.__version__, pandas.__version__, scipy.__version__)"
      - name: Test (incl. byte-for-byte comparison with popgen3 3.0.4 from PyPI)
        env:
          POPGEN_DIFFERENTIAL: "1"
        run: python -m pytest -q

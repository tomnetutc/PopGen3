[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popgen3"
dynamic = ["version"]
description = "A population synthesis and sample weighting tool for transportation planning."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Fan Yu", email = "fanyu4@asu.edu" }]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.21.6",
    # pandas 4 removes APIs PopGen still uses (inplace= on set_index/sort_values/...,
    # deprecated in pandas 3.1); lift the cap once 3.1 drops them.
    "pandas>=1.3.0,<4",
    "scipy>=1.10.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/tomnetutc/PopGen3"
Source = "https://github.com/tomnetutc/PopGen3"
Changelog = "https://github.com/tomnetutc/PopGen3/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
popgen = "popgen.cli:main"

[tool.setuptools]
packages = ["popgen"]

[tool.setuptools.dynamic]
version = { attr = "popgen.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
